name: Keep Render API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check Render API health
        run: curl --fail --silent --show-error --max-time 30 https://cricketvault-api.onrender.com/api/v1/health
