name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm test
          npm run build

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Store the output of: ssh-keyscan -H YOUR_VPS_IP in VPS_KNOWN_HOSTS.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -n "$VPS_HOST"

      - name: Deploy and reload
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          : "${VPS_USER:?Set VPS_USER}" "${VPS_DEPLOY_PATH:?Set VPS_DEPLOY_PATH}"
          ssh -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "VPS_DEPLOY_PATH='${VPS_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          cd "$VPS_DEPLOY_PATH"
          git fetch --prune origin main
          git checkout main
          git pull --ff-only origin main
          npm ci
          npm run build
          mkdir -p /var/log/cricketvault
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/v1/health; then
              exit 0
            fi
            sleep 2
          done

          echo "API health check failed after 30 seconds" >&2
          pm2 logs cricketvault-api --lines 80 --nostream || true
          exit 1
          REMOTE
