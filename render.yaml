services:
  - type: web
    name: cricketvault-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w @cricketvault/server
    startCommand: npm run start -w @cricketvault/server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_ALLOW_TEST_MODE_IN_PRODUCTION
        value: "false"
      - key: RAZORPAY_MODE
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
