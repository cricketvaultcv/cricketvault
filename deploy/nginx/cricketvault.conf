# Replace yourdomain.in before installing this file in /etc/nginx/sites-available/cricketvault.
# The API remains private on 127.0.0.1:4000; only Nginx is internet-facing.
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.in www.yourdomain.in;

    root /var/www/cricketvault/client/dist;
    index index.html;
    client_max_body_size 2m;

    # Preserve the API path: /api/v1/... becomes http://127.0.0.1:4000/api/v1/...
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Immutable hashed Vite assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
